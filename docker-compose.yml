# Local services for tax_assistant. Bring up the whole stack with:
#     docker compose up -d
#
# After first start, grab the Convex admin key:
#     docker compose exec convex-backend ./generate_admin_key.sh
# Then drop it into .env as CONVEX_SELF_HOSTED_ADMIN_KEY.
#
# Endpoints (host-side):
#   - Convex backend (HTTPS via Caddy)  https://100.64.0.4:3320  ← apps use this (CONVEX_URL)
#   - Convex HTTP actions (HTTPS)       https://100.64.0.4:3321  ← OIDC callback lives here (CONVEX_SITE_URL)
#   - Convex backend (HTTP direct)      http://127.0.0.1:3310       ← for CLI / debugging
#   - Convex HTTP actions (HTTP direct) http://127.0.0.1:3311
#   - Convex dashboard                  http://127.0.0.1:6891
#   - Postgres                          postgres://tax_assistant:tax_assistant@127.0.0.1:5532/tax_assistant

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5532:5432'
    environment:
      POSTGRES_USER: tax_assistant
      POSTGRES_PASSWORD: tax_assistant
      POSTGRES_DB: tax_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tax_assistant -d tax_assistant']
      interval: 5s
      timeout: 5s
      retries: 10

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '3310:3210'
      - '3311:3211'
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-tax_assistant}
      INSTANCE_SECRET: ${INSTANCE_SECRET:-}
      # Public origins the backend itself uses when generating URLs (and what
      # better-auth derives its baseURL from via the auto-injected
      # CONVEX_SITE_URL). Sourced from the SAME .env values the apps load
      # (CONVEX_URL / CONVEX_SITE_URL) so the backend, the apps, and the
      # browser never drift onto different host IPs. Point at the Caddy HTTPS
      # frontend so any URLs the backend emits work for HTTPS browser clients.
      CONVEX_CLOUD_ORIGIN: ${CONVEX_URL:-https://100.64.0.4:3320}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_URL:-https://100.64.0.4:3321}
      # Point Convex at the self-hosted Postgres above (intra-container DNS).
      POSTGRES_URL: postgres://tax_assistant:tax_assistant@postgres:5432
      DO_NOT_REQUIRE_SSL: 'true'
      DISABLE_BEACON: ${DISABLE_BEACON:-true}
      REDACT_LOGS_TO_CLIENT: ${REDACT_LOGS_TO_CLIENT:-false}
    volumes:
      - convex_data:/convex/data
    depends_on:
      postgres:
        condition: service_healthy

  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '6891:6791'
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_SELF_HOSTED_URL:-http://127.0.0.1:3310}
    depends_on:
      - convex-backend

  # TLS-terminating reverse proxy in front of convex-backend. Mounts the
  # mkcert dev cert (same one the Next.js apps serve) so apps, OIDC redirects,
  # and Convex all live behind a single trusted certificate.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '3320:3320'
      - '3321:3321'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - convex-backend

volumes:
  postgres_data:
  convex_data:
