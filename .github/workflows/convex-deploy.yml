name: Convex deploy

# Выкатывает функции Convex на свой сервер и применяет настройки (env) развёртывания.
# Запускается вручную: Actions → Convex deploy → Run workflow.
#
# Нужны три секрета репозитория (значения печатает bootstrap.sh на сервере):
#   CONVEX_SELF_HOSTED_URL          например https://api.oknalog.net
#   CONVEX_SELF_HOSTED_ADMIN_KEY    ключ администратора Convex
#   CONVEX_ENV                      строки KEY=VALUE, по одной на строку

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Загрузить справочник (seed:run) — нужно при первом запуске"
        type: boolean
        default: false

concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  convex:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/convex
    env:
      CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
      CONVEX_ENV: ${{ secrets.CONVEX_ENV }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Check secrets
        run: |
          for v in CONVEX_SELF_HOSTED_URL CONVEX_SELF_HOSTED_ADMIN_KEY CONVEX_ENV; do
            if [ -z "${!v}" ]; then echo "::error::Секрет $v не задан"; exit 1; fi
          done

      - name: Placeholder JWKS (first deploy only)
        run: |
          cur="$(pnpm exec convex env get JWKS 2>/dev/null || true)"
          if [ -z "$cur" ]; then
            pnpm exec convex env set JWKS '[]'
          fi

      - name: Deploy functions
        run: pnpm exec convex deploy

      - name: Apply deployment env
        run: |
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            val="${line#*=}"
            echo "::add-mask::$val"
            pnpm exec convex env set "$key" "$val"
          done <<< "$CONVEX_ENV"

      - name: Generate real JWKS (first deploy only)
        run: |
          cur="$(pnpm exec convex env get JWKS 2>/dev/null || true)"
          if [ -z "$cur" ] || [ "$cur" = "[]" ]; then
            pnpm exec convex run jwks:generate --no-push 2>/dev/null | pnpm exec convex env set JWKS
          fi

      - name: Seed catalogue
        if: ${{ inputs.seed }}
        run: pnpm exec convex run seed:run
