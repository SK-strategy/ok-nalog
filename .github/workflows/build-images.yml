name: Build images

# Собирает Docker-образы приложений и пакет с файлами для сервера и кладёт их
# в GitHub Container Registry (ghcr.io/<владелец>/ok-nalog-*).
# Сервер потом забирает свежие образы командой `docker compose pull`.

on:
  push:
    branches: ["main", "deploy/prod"]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin, tma, bot]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Owner in lowercase
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/ok-nalog-${{ matrix.app }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/ok-nalog-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Необязательно: если секрета нет, клиентский Sentry просто не включается.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  deploy-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Owner in lowercase
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push deploy bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.deploy
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/ok-nalog-deploy:latest

  deploy:
    # Автовыкат на прод после сборки образов: сервер сам тянет свежие образы
    # и пересоздаёт web/admin (deploy/server/update.sh). Функции Convex этот
    # джоб не трогает — для них отдельный workflow convex-deploy.yml.
    # Требует секрет DEPLOY_SSH_KEY (приватный ключ с доступом root@прод-сервер).
    needs: apps
    runs-on: ubuntu-latest
    # Не выкатываем, если секрет ещё не заведён — сборка образов при этом
    # остаётся зелёной, как раньше.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Update production server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 138.16.183.89 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@138.16.183.89 'bash /opt/ok-nalog/update.sh'

      - name: Smoke check
        run: |
          sleep 5
          curl -fsS -o /dev/null -w 'site: %{http_code}\n' --retry 5 --retry-all-errors --retry-delay 4 https://oknalog.net/
